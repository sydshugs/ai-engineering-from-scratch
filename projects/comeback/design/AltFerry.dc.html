<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&display=swap">
  <style>
    body { margin: 0; background: #ffffff; color: #333333; font-family: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    a { color: #333333; } a:hover { color: #000000; }
  </style>
</helmet>
<div style="width: 560px; min-height: 420px; box-sizing: border-box; padding: 32px; background: #ffffff; border: 2px dashed #bbbbbb; display: flex; flex-direction: column; gap: 20px;">
  <div style="font-size: 12px; color: #888888; letter-spacing: 0.08em; text-transform: uppercase;">Alternate name · low-fi</div>
  <div style="display: flex; align-items: center; gap: 16px;">
    <svg viewBox="0 0 64 64" width="56" height="56" fill="none" stroke="#333333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 40H56"></path><path d="M14 40L20 52H44L50 40"></path><path d="M24 40V22H40V40"></path></svg>
    <span style="font-size: 56px; font-weight: 600; letter-spacing: -0.03em; line-height: 1;">Ferry</span>
  </div>
  <div style="font-size: 16px; line-height: 1.5;">A driver ferries it back. Short, plain, one syllable in a button: "Ferry it back."</div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; font-size: 14px; line-height: 1.5;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-weight: 600;">Tone</span>
      <span style="color: #666666;">Utility. Logistics-first. Would suit a B2B-only pitch with no shopper-facing brand.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-weight: 600;">Tradeoff</span>
      <span style="color: #666666;">Reads as boats. Crowded word in app stores. Says nothing about the customer coming back.</span>
    </div>
  </div>
  <div style="display: flex; gap: 8px;">
    <div style="width: 48px; height: 48px; background: #1f3a5f;"></div>
    <div style="width: 48px; height: 48px; background: #e8eef5;"></div>
    <div style="width: 48px; height: 48px; background: #f2b632;"></div>
  </div>
</div>
</x-dc>
